# .github/workflows/terraform-ci.yml
#
# Runs on every push to main and every pull request.
# Validates formatting and syntax. No AWS credentials are used:
# the infrastructure has been torn down, so this pipeline checks the
# code only (init -backend=false skips the S3 state backend entirely).
# Apply is never automated — human review required.

name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.11.0"

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest
    permissions:
      contents: read   # least privilege: no id-token, no write access

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        # Fails the pipeline if any .tf file is not correctly formatted.

      - name: Terraform Init (no backend)
        id: init
        run: terraform init -backend=false
        # Downloads the AWS provider only. Skips the S3 backend, so no
        # AWS credentials are needed and no state is read.

      - name: Terraform Validate
        id: validate
        run: terraform validate
        # Validates HCL syntax and internal consistency.
        # Catches missing variables, invalid references, and type errors.
